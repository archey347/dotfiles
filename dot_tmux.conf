# Without mouse on, a drag is the outer terminal's own selection, which knows
# nothing about panes and grabs every pane on the line. Letting tmux own the
# drag is what makes copy work under mssh's synchronize-panes.
set -g mouse on

# Default is "external", under which tmux never pushes its own copy-mode
# selections to the system clipboard. Ghostty advertises Ms and allows OSC 52
# writes, so "on" is enough - no terminal-overrides needed.
set -g set-clipboard on
